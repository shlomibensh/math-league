<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ליגת המספרים – אימון למבדק כיתה ד׳</title>
<meta name="theme-color" content="#14223D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ליגת המספרים">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --nbpaper:#FFFFFF;--sq:#CCDEF3;--slot:#9DB9DD;--pen:#1D4ED8;
  --grass:#2F8A47;--grass2:#287C3F;
  --paper:#FBFDF8;--field:#FFFFFF;--ink:#14301F;--muted:#557060;--line:#D3E4D6;
  --navy:#14223D;--navy2:#22365E;--led:#FFC83D;--led-edge:#C9971D;--led-ink:#14223D;
  --goal:#1E9B4B;--goal-bg:#E3F5E8;--save:#D23B3B;--save-bg:#FCE9E9;--post:#B7791F;--post-bg:#FFF4D9;
  --bar:#3C7BD9;--vdot:#2563EB;--focus:#2563EB;
  --shadow:0 3px 0 rgba(10,40,20,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --nbpaper:#15251B;--sq:#2B4658;--slot:#4E7292;--pen:#8FB5FF;
    --grass:#17452A;--grass2:#133B24;
    --paper:#1A2A20;--field:#223528;--ink:#E8F2EA;--muted:#9FB8A8;--line:#355241;
    --goal-bg:#173F27;--save-bg:#43211F;--post-bg:#3F3216;
    --bar:#6FA1F0;--vdot:#7AA7FF;--shadow:0 3px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --nbpaper:#15251B;--sq:#2B4658;--slot:#4E7292;--pen:#8FB5FF;
  --grass:#17452A;--grass2:#133B24;
  --paper:#1A2A20;--field:#223528;--ink:#E8F2EA;--muted:#9FB8A8;--line:#355241;
  --goal-bg:#173F27;--save-bg:#43211F;--post-bg:#3F3216;
  --bar:#6FA1F0;--vdot:#7AA7FF;--shadow:0 3px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55;
  background-color:var(--grass);
  background-image:repeating-linear-gradient(180deg,var(--grass) 0 72px,var(--grass2) 72px 144px);
}
#app{max-width:560px;margin:0 auto;padding:14px 14px 48px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.m{font-variant-numeric:tabular-nums;font-weight:700;unicode-bidi:isolate}
img,svg{max-width:100%}

/* scoreboard */
.board{background:var(--navy);color:#fff;border-radius:18px;padding:14px 18px;border:3px solid var(--navy2);box-shadow:var(--shadow)}
.brand{font-family:"Secular One","Rubik",sans-serif;font-size:26px;line-height:1.2}
.board-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;gap:12px}
.who{font-size:16px;opacity:.85}
.led{font-family:"Secular One","Rubik",sans-serif;color:var(--led);text-shadow:0 0 14px rgba(255,200,61,.45);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.led small{font-size:18px;opacity:.75}
.howto{color:#fff;font-size:15px;margin:12px 4px}
.cup{display:block;width:100%;text-align:right;margin:4px 0 16px;padding:14px 18px;border:0;border-bottom:4px solid var(--led-edge);border-radius:16px;background:var(--led);color:var(--led-ink)}
.cup-t{display:block;font-family:"Secular One","Rubik",sans-serif;font-size:24px;line-height:1.2}
.cup-s{display:block;font-size:14px;margin-top:2px}

/* league table */
.league{background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.league-head{display:flex;justify-content:space-between;padding:8px 18px;background:var(--navy);color:#fff;font-size:14px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;text-align:right}
.row:nth-of-type(even){background:var(--field)}
.row:active{filter:brightness(.97)}
.row .ic{font-size:24px;width:30px;text-align:center;flex:none}
.row .nm{flex:1;font-weight:600}
.tr{white-space:nowrap;letter-spacing:1px;font-size:15px;flex:none}
.tr .off{opacity:.2;filter:grayscale(1)}
.foot{color:#fff;font-size:13px;margin:16px 6px;opacity:.9}
.link{background:none;border:0;color:#fff;text-decoration:underline;padding:6px 0;margin-inline-end:14px;font-size:13px}

/* game */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exit{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:18px}
.score{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);color:#fff;border-radius:14px;padding:6px 14px;border:3px solid var(--navy2)}
.score .t{font-size:14px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .d{font-family:"Secular One","Rubik",sans-serif;font-size:32px;line-height:1.1;color:var(--led);text-shadow:0 0 12px rgba(255,200,61,.45);letter-spacing:3px}
.score .d b{font-weight:400;display:inline-block}
.score .d b.bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.kicks{display:flex;gap:7px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.kicks i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.kicks i.c{border-color:var(--led);box-shadow:0 0 0 2px rgba(255,200,61,.35)}
.kicks i.g{background:#fff;border-color:#fff}
.kicks i.s{background:var(--save);border-color:var(--save)}

.card{background:var(--paper);border-radius:18px;padding:16px 16px 18px;box-shadow:var(--shadow)}
.q-meta{font-size:14px;color:var(--muted);margin-bottom:6px}
.q-prompt{font-size:19px;font-weight:500}
.q-visual{margin:12px 0 4px;display:flex;justify-content:center;overflow-x:auto;color:var(--ink)}
.q-visual svg{height:auto}
.ans{display:flex;gap:8px;margin-top:14px}
.ans input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
.ans input:disabled{opacity:.7}
.kick{flex:none;background:var(--led);color:var(--led-ink);border:0;border-bottom:4px solid var(--led-edge);border-radius:12px;padding:10px 18px;font-weight:800;font-size:18px}
.kick:disabled{opacity:.5}
.kick.wide{width:100%;padding:14px}
.ghost{width:100%;padding:13px;border-radius:12px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-weight:700;margin-top:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opts.wide{grid-template-columns:1fr}
.opts.sym{grid-template-columns:repeat(3,1fr)}
.opt{min-height:54px;font-size:19px;font-weight:700;background:var(--field);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.opts.wide .opt{font-size:17px;text-align:right}
.opts.sym .opt{font-size:30px;line-height:1}
.opt.right{background:var(--goal-bg);border-color:var(--goal)}
.opt.wrong{background:var(--save-bg);border-color:var(--save)}
.opt:disabled{cursor:default}
.cmpx{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.cmpx .w{font-size:17px;font-weight:600}
.cbox{width:52px;height:52px;flex:none;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:30px;line-height:1}
.cbox.ok{border-color:var(--goal);color:var(--goal)}
.cbox.no{border-color:var(--save);color:var(--save)}
.hint-btn{margin-top:12px;background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline;padding:6px 0}
.hint{margin-top:6px;background:var(--post-bg);border-radius:12px;padding:10px 12px;font-size:16px}
.fb{margin-top:12px}
.panel{border-radius:12px;padding:12px 14px;font-size:16px}
.panel h3{margin:0 0 4px;font-family:"Secular One","Rubik",sans-serif;font-size:22px;font-weight:400;line-height:1.3}
.panel.goal{background:var(--goal-bg);border-inline-start:6px solid var(--goal)}
.panel.save{background:var(--save-bg);border-inline-start:6px solid var(--save)}
.panel.post{background:var(--post-bg);border-inline-start:6px solid var(--post)}
.explain{margin-top:8px}
.next{margin-top:12px}

.boxed{display:inline-block;direction:ltr;unicode-bidi:isolate;border:2px solid var(--ink);border-radius:6px;padding:0 6px;font-weight:700;font-variant-numeric:tabular-nums}
.words{margin-top:8px;font-size:20px;font-weight:700;background:var(--field);border:2px dashed var(--line);padding:10px 12px;border-radius:12px}
.seq{margin-top:10px;font-size:22px;text-align:center}
.big{font-size:30px;font-weight:800;text-align:center;margin-top:8px}
.blank{display:inline-block;min-width:26px;border-bottom:3px solid var(--ink);margin-inline-start:2px}
.vert{font-size:26px;font-weight:700;border-collapse:collapse;margin:8px auto;font-variant-numeric:tabular-nums}
.vert td{width:24px;height:34px;text-align:center;padding:0 1px}
.vert tr.line td{border-top:3px solid var(--ink);height:8px}
.placetab{border-collapse:collapse;margin:8px 0;font-size:15px}
.placetab th,.placetab td{border:1px solid var(--line);padding:3px 9px;text-align:center}
.placetab td{font-size:19px;font-weight:700}
.gem{display:flex;gap:10px;justify-content:center;direction:rtl;flex-wrap:wrap}
.gcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.gblank{width:38px;height:36px;border-bottom:3px solid var(--ink)}
.gnum{font-weight:700;font-size:18px}
.gtable{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;font-size:14px}
.gtable span{background:var(--field);border-radius:6px;padding:3px 0;text-align:center;white-space:nowrap}
.gtable b{margin-inline-end:4px;font-size:16px}
.bigl{font-size:28px;font-weight:800;line-height:1}
.ct{text-align:center;font-weight:600;font-size:15px;margin-bottom:4px}
.qv-col{display:flex;flex-direction:column;align-items:center}
svg .shape,svg .shape *{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .tick{stroke:currentColor;stroke-width:2}
svg .ra{fill:none;stroke:currentColor;stroke-width:2}
svg .grid{stroke:var(--line);stroke-width:1}
svg .bar{fill:var(--bar)}
svg .dot{fill:var(--save)}
svg .dotq{fill:var(--save)}
svg .vdot{fill:var(--vdot)}

/* end screens */
.final{text-align:center}
.final .brand{font-size:20px}
.final-score{display:flex;justify-content:center;align-items:center;gap:16px;margin:10px 0}
.final-score .t{font-size:15px;opacity:.85;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.final-score .d{font-family:"Secular One","Rubik",sans-serif;font-size:56px;line-height:1;color:var(--led);text-shadow:0 0 16px rgba(255,200,61,.5);letter-spacing:4px}
.trophies.big{font-size:40px;letter-spacing:6px}
.rec{color:var(--led);font-weight:700}
.endbtns{margin-top:14px}
.practice{background:var(--paper);border-radius:18px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
.practice h2{margin:0 0 8px;font-size:18px}
.practice .row{border-top:1px solid var(--line);padding:11px 4px}

/* name screen */
.kickoff{background:var(--paper);border-radius:22px;padding:28px 20px 22px;margin-top:10vh;box-shadow:var(--shadow);text-align:center}
.kickoff .ballbig{font-size:64px;line-height:1}
.kickoff h1{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:36px;margin:8px 0 4px}
.kickoff p{margin:0 0 18px;color:var(--muted)}
.kickoff label{display:block;font-weight:700;text-align:right}

/* column notebook — squared paper, pupil writes in blue pen */
.nbwrap{display:flex;justify-content:center;overflow-x:auto;margin:14px 0 4px}
.nb{--c:44px;flex:none;display:grid;grid-template-columns:repeat(var(--cols),var(--c));grid-auto-rows:var(--c);
  background-color:var(--nbpaper);
  background-image:linear-gradient(var(--sq) 1px,transparent 1px),linear-gradient(90deg,var(--sq) 1px,transparent 1px);
  background-size:var(--c) var(--c);border-right:1px solid var(--sq);border-bottom:1px solid var(--sq);color:var(--ink)}
.nb.show{--c:34px;margin:4px 0}
.scr .nb{--c:40px}
.nc{display:grid;place-items:center;min-width:0;font-size:calc(var(--c)*.6);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.nc.hw{place-items:end center;padding-bottom:3px}
.nc.pen{color:var(--pen)}
.nc.hw.pen{font-size:calc(var(--c)*.42)}
.nc.hw.pen.two{font-size:calc(var(--c)*.34)}
.nc.rl{box-shadow:inset 0 3px 0 var(--ink)}
.dg.struck{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--pen)}
.cell{font:inherit;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;padding:0;display:grid;place-items:center;
  color:var(--pen);background:transparent;border:2px dashed var(--slot);border-radius:8px;cursor:pointer;touch-action:manipulation}
.cell.rc{width:calc(var(--c) - 8px);height:calc(var(--c) - 10px);margin-top:3px;font-size:calc(var(--c)*.6)}
.cell.hp{width:calc(var(--c) - 14px);height:calc(var(--c) - 18px);font-size:calc(var(--c)*.42);border-width:1.5px;opacity:.85}
.cell.hp.two{font-size:calc(var(--c)*.32);letter-spacing:-.5px}
.cell.on{border-color:transparent;opacity:1}
.cell.sel{border:2px solid var(--focus);background:rgba(37,99,235,.12);opacity:1}
.cell.bad{border:2px solid var(--post);background:var(--post-bg)}
.cell:disabled{cursor:default;border-color:transparent}
.pad[hidden]{display:none}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.key{height:50px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--field);color:var(--ink);
  font:inherit;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;touch-action:manipulation;padding:0}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key:disabled,.padkick:disabled{opacity:.45}
.key.del{grid-column:span 2;font-size:22px}
.key.clr{grid-column:span 3;font-size:16px}
.padkick{grid-column:span 3;height:50px;padding:0;touch-action:manipulation}
.tools{display:flex;flex-wrap:wrap;gap:0 22px;margin-top:10px}
.tools .hint-btn{margin-top:0}
.scr{margin-top:10px;background:var(--field);border:2px dashed var(--line);border-radius:14px;padding:12px}
.scr-t{font-size:14px;color:var(--muted);margin-bottom:8px}
.scr-build{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.scr-build input{width:76px;font:inherit;font-size:20px;font-weight:700;padding:7px 4px;text-align:center;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.ops3{display:flex;gap:4px}
.opb{width:40px;height:44px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:22px;font-weight:700;padding:0}
.opb[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--led)}
.kick.sm{padding:8px 16px;font-size:16px}

/* progress on the home screen */
.streak{margin-top:8px;font-size:14px;opacity:.92}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px 12px 12px;
  background:var(--paper);border-radius:16px;border-inline-start:8px solid var(--led);box-shadow:var(--shadow)}
.resume-t{font-size:15px;line-height:1.4}
.tag{display:inline-block;background:var(--led);color:var(--led-ink);font-size:12px;font-weight:700;line-height:1.7;border-radius:999px;padding:0 8px;margin-inline-end:6px}
.cup .tag{background:var(--navy);color:var(--led)}
.row .nm small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.redo{display:block;width:100%;text-align:right;margin:-4px 0 16px;padding:12px 18px;border:0;border-inline-start:8px solid var(--save);border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.redo-t{display:block;font-family:"Secular One","Rubik",sans-serif;font-size:21px;line-height:1.25}
.redo-s{display:block;font-size:14px;color:var(--muted)}
.sync{display:inline-block;margin:6px 0 2px;opacity:.85}

/* training log */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.stats3 b{display:block;font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:30px;line-height:1.1;color:var(--led);font-variant-numeric:tabular-nums}
.stats3 span{font-size:13px;opacity:.85}
.sheet{background:var(--paper);border-radius:18px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
.sheet h2{margin:0 0 8px;font-size:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:118px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:12px;color:var(--muted)}
.week b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.week i{display:block;width:70%;max-width:30px;background:var(--goal);border-radius:6px 6px 0 0}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sheet h2+.lrow{border-top:0}
.lrow .ic{width:28px;flex:none;text-align:center;font-size:20px}
.lrow .nm{flex:1;min-width:0;font-weight:600}
.lrow small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.lrow .sc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{display:block;color:var(--save);font-weight:600}
.empty{margin:0;color:var(--muted)}

.board-p{margin:6px 0 0;font-size:15px;opacity:.9}
.sheet-p{margin:0 0 8px;font-size:15px;color:var(--muted)}
.code{display:block;width:100%;margin-bottom:10px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
  border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);resize:vertical}
.toast.ok{color:var(--goal)}
.note{font-size:14px;color:var(--muted);text-align:right;margin-top:2px}
.pcode{font-family:"Secular One","Rubik",sans-serif;font-size:32px;letter-spacing:3px;text-align:center;background:var(--navy);color:var(--led);border-radius:14px;padding:10px 8px;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.ghost.dark{color:var(--ink);border-color:var(--line)}
.goalflash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9}
.goalflash span{font-family:"Secular One","Rubik",sans-serif;font-size:78px;color:var(--led);text-shadow:0 5px 0 var(--navy),0 0 30px rgba(255,200,61,.6);animation:pop .95s ease-out forwards}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}30%{transform:scale(1.15) rotate(3deg);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.05);opacity:0}}
.toast{margin-top:10px;font-size:15px;color:var(--save);font-weight:600}
@media (prefers-reduced-motion:reduce){
  .goalflash{display:none}
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (max-width:380px){
  .q-prompt{font-size:18px}
  .brand{font-size:23px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const uniq=a=>[...new Set(a)];
const fmt=n=>Number(n).toLocaleString('en-US');
const m=s=>`<span class="m" dir="ltr">${s}</span>`;
const sym=(a,b)=>a<b?'<':a>b?'>':'=';
const symH=s=>s==='<'?'&lt;':s==='>'?'&gt;':'=';
const digs=n=>[Math.floor(n/1000)%10,Math.floor(n/100)%10,Math.floor(n/10)%10,n%10];
const fromDigs=d=>d[0]*1000+d[1]*100+d[2]*10+d[3];
const clean=s=>String(s).replace(/[,\s]/g,'');
const isInt=s=>/^\d+$/.test(clean(s));
const normHe=s=>String(s).replace(/[\s"'״׳\-]/g,'').replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ');
const joinHe=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' ו'+a[a.length-1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q={
  num:o=>Object.assign({kind:'num'},o),
  text:o=>Object.assign({kind:'text'},o),
  open:o=>Object.assign({kind:'open'},o),
  choice:o=>Object.assign({kind:'choice'},o),
  cmp:o=>Object.assign({kind:'cmp',prompt:'סמנו &lt;, &gt; או = בתוך הריבוע.'},o)
};

const UNITS=['','אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע'];
const TEENS=['עשר','אחת עשרה','שתים עשרה','שלוש עשרה','ארבע עשרה','חמש עשרה','שש עשרה','שבע עשרה','שמונה עשרה','תשע עשרה'];
const TENS=['','עשר','עשרים','שלושים','ארבעים','חמישים','שישים','שבעים','שמונים','תשעים'];
const HUNDREDS=['','מאה','מאתיים','שלוש מאות','ארבע מאות','חמש מאות','שש מאות','שבע מאות','שמונה מאות','תשע מאות'];
const THOUSANDS=['','אלף','אלפיים','שלושת אלפים','ארבעת אלפים','חמשת אלפים','ששת אלפים','שבעת אלפים','שמונת אלפים','תשעת אלפים'];
function heWords(n){
  if(n===0)return 'אפס';
  const [th,h,t,u]=digs(n);const p=[];
  if(th)p.push(THOUSANDS[th]);
  if(h)p.push(HUNDREDS[h]);
  if(t===1)p.push(TEENS[u]);else{if(t)p.push(TENS[t]);if(u)p.push(UNITS[u]);}
  if(p.length>1)p[p.length-1]='ו'+p[p.length-1];
  return p.join(' ');
}
function placeTable(n){
  const d=String(n).split('').map(Number);
  const heads=['אלפים','מאות','עשרות','יחידות'].slice(4-d.length);
  return `<table class="placetab" dir="ltr"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr><tr>${d.map(x=>`<td>${x}</td>`).join('')}</tr></table>`;
}
function vertical(a,b,op){
  const A=String(a),B=String(b),w=Math.max(A.length,B.length);
  const row=(s,pre)=>'<tr><td>'+pre+'</td>'+s.padStart(w,' ').split('').map(c=>`<td>${c===' '?'':c}</td>`).join('')+'</tr>';
  return `<table class="vert" dir="ltr">${row(A,'')}${row(B,op)}<tr class="line">${'<td></td>'.repeat(w+1)}</tr></table>`;
}
function randWithZeros(){const d=[rnd(1,9)];for(let i=0;i<3;i++)d.push(Math.random()<0.4?0:rnd(1,9));return fromDigs(d);}
function distract(n,k){
  const d=digs(n);
  const perms=[[0,2,1,3],[0,1,3,2],[0,3,2,1],[0,2,3,1],[0,3,1,2]];
  const pv=shuffle(perms.map(p=>fromDigs(p.map(i=>d[i]))));
  const ov=shuffle([n+100,n-100,n+10,n-10,n+1000,n-1000,n+1,n-1]);
  return uniq([...pv,...ov]).filter(v=>v!==n&&v>=1000&&v<=9999).slice(0,k);
}

/* ================= 1. place value ================= */

    answer:ans,
    hint:`המספר <b>${prev?'הקודם':'העוקב'}</b> ${prev?'קטן':'גדול'} ב-1. שימו לב מה קורה כש${prev?'יורדים מ-0: ה-0 הופך ל-9':'עוברים את 9: ה-9 הופך ל-0'}.`,
    explain:m(`${fmt(n)} ${prev?'−':'+'} 1 = ${fmt(ans)}`)

function pvNumToWords(){

function pvDigits(){
  const a=rnd(1,9);let b;do{b=rnd(1,9);}while(b===a);
  const withZero=Math.random()<0.7;let c;
  if(withZero)c=0;else{do{c=rnd(1,9);}while(c===a||c===b);}
  const ds=[a,b,c],big=Math.random()<0.5;
  const desc=ds.slice().sort((x,y)=>y-x),asc=ds.slice().sort((x,y)=>x-y);
  const ans=big?desc[0]*100+desc[1]*10+desc[2]:(asc[0]===0?asc[1]*100+asc[2]:asc[0]*100+asc[1]*10+asc[2]);
  return Q.num({
    prompt:`לפניכם הספרות ${m(shuffle(ds).join(',  '))}.<br>השתמשו בכל ספרה פעם אחת והרכיבו את המספר התלת-ספרתי <b>ה${big?'גדול':'קטן'} ביותר</b>.`,
    answer:ans,
    hint:big?'שימו את הספרה הגדולה ביותר במקום הכי "שווה" – המאות.':(withZero?'זהירות! מספר תלת-ספרתי לא יכול להתחיל ב-0. איפה עוד אפשר לשים את ה-0?':'שימו את הספרה הקטנה ביותר במקום המאות.'),
    explain:big?`מסדרים מהספרה הגדולה לקטנה: ${m(ans)}`:(withZero?`0 לא יכול להיות ראשון, אז מתחילים ב-${Math.floor(ans/100)} ומיד אחריו ה-0: ${m(ans)}`:`מסדרים מהספרה הקטנה לגדולה: ${m(ans)}`)
  });
}
function pvWhoAmI(){
  const four=Math.random()<0.35;
  const th=four?rnd(2,9):0,h=rnd(2,9);
  let t=Math.random()<0.3?0:rnd(2,9),u=Math.random()<0.2?0:rnd(2,9);
  if(!t&&!u)u=rnd(2,9);
  let parts=[];
  if(th)parts.push(`${th} אלפים`);
  parts.push(`${h} מאות`);
  if(t)parts.push(`${t} עשרות`);
  if(u)parts.push(`${u} יחידות`);
  if(Math.random()<0.4)parts=shuffle(parts);
  const n=th*1000+h*100+t*10+u;
  return Q.num({
    prompt:`<b>מי אני?</b><br>אני מספר הבנוי ${joinHe(parts.map(p=>'מ-'+p))}.`,
    answer:n,
    hint:'ציירו טבלת ערך המקום (אלפים, מאות, עשרות, יחידות) ומלאו כל מקום. מקום שלא מוזכר מקבל 0.',
    explain:placeTable(n)+`אני ${m(fmt(n))}`
  });
}
function pvBuild(){
  const v=rnd(0,2);
  const P=['אלפים','מאות','עשרות','יחידות'],ORD=['הראשונה','השנייה','השלישית','הרביעית'];
  if(v===0){
    const i=rnd(0,3),d=rnd(1,9),ds=[rnd(1,9),rnd(0,9),rnd(0,9),rnd(0,9)];ds[i]=d;const s=fromDigs(ds);
    return Q.open({
      prompt:`כתבו מספר <b>ארבע-ספרתי</b> שספרת ה${P[i]} שלו ${d}.`,
      check:x=>{if(!isInt(x))return false;const n=+clean(x);return n>=1000&&n<=9999&&digs(n)[i]===d;},
      sample:fmt(s),
      hint:`מספר ארבע-ספרתי הוא בין 1,000 ל-9,999. ספרת ה${P[i]} היא הספרה ${ORD[i]} משמאל.`,
      explain:`יש הרבה תשובות נכונות! למשל ${m(fmt(s))}`+placeTable(s)

  if(v===1){
    const a=rnd(1,9),b=rnd(0,9),s=a*1000+rnd(0,9)*100+rnd(0,9)*10+b;
    return Q.open({
      prompt:`כתבו מספר <b>ארבע-ספרתי</b> שספרת האלפים שלו ${a} וספרת היחידות שלו ${b}.`,
      check:x=>{if(!isInt(x))return false;const n=+clean(x);return n>=1000&&n<=9999&&digs(n)[0]===a&&digs(n)[3]===b;},

  const u=rnd(0,9),t=rnd(0,9),s=rnd(1,9)*100+t*10+u;
  return Q.open({
    prompt:`כתבו מספר <b>תלת-ספרתי</b> שספרת היחידות שלו ${u} וספרת העשרות שלו ${t}.`,
    check:x=>{if(!isInt(x))return false;const n=+clean(x);return n>=100&&n<=999&&n%10===u&&Math.floor(n/10)%10===t;},
    sample:String(s),
    hint:'היחידות – הספרה הכי ימנית. העשרות – הספרה שלידה משמאל.',

function pvScale(){
  const v=rnd(0,3);
  if(v===0){const n=rnd(100,899);return Q.num({prompt:`הגדילו את המספר ${m(fmt(n))} <b>ב-100</b>.`,answer:n+100,hint:'"ב-100" = מוסיפים 100. רק ספרת המאות משתנה.',explain:m(`${fmt(n)} + 100 = ${fmt(n+100)}`)});}

  if(v===2){const n=rnd(100,999)*10;return Q.num({prompt:`הקטינו את המספר ${m(fmt(n))} <b>פי 10</b>.`,answer:n/10,hint:'"הקטינו פי 10" = מחלקים ב-10. מורידים את ה-0 מהסוף.',explain:m(`${fmt(n)} : 10 = ${fmt(n/10)}`)});}
  const n=rnd(100,989);return Q.num({prompt:`הגדילו את המספר ${m(fmt(n))} <b>ב-10</b>.`,answer:n+10,hint:'זהירות: "ב-10" זה לא "פי 10"! "ב-10" = מוסיפים 10.',explain:m(`${fmt(n)} + 10 = ${fmt(n+10)}`)});

/* ================= 2. compare, sequences, number line ================= */
function cmpNums(){
  const a=rnd(1000,9999),b=Math.random()<0.2?a:pick(distract(a,4));
  return Q.cmp({left:fmt(a),right:fmt(b),answer:sym(a,b),
    hint:'משווים משמאל לימין: קודם ספרת האלפים. אם היא שווה – עוברים למאות, וכן הלאה. הפה הפתוח של הסימן פונה למספר הגדול.',
    explain:m(`${fmt(a)} ${symH(sym(a,b))} ${fmt(b)}`)});
}
function pvCompareWords(){
  const a=randWithZeros(),b=Math.random()<0.25?a:pick(distract(a,3));
  const W={h:`<span class="w" dir="rtl">${heWords(a)}</span>`,v:a},N={h:fmt(b),v:b};
  const [L,R]=Math.random()<0.5?[N,W]:[W,N];
  const s=sym(L.v,R.v);
  return Q.cmp({left:L.h,right:R.h,answer:s,
    hint:'קודם הפכו את המילים למספר, ורק אז השוו ספרה-ספרה.',
    explain:`${heWords(a)} = ${m(fmt(a))}<br>${m(`${fmt(L.v)} ${symH(s)} ${fmt(R.v)}`)}`});
}
const ruleText=d=>d>0?`עולה ב-${fmt(d)}`:`יורדת ב-${fmt(-d)}`;
function seqNext(){
  const step=pick([100,-10,10,-100,1000,5,-5,25,50,-50,200,-1]);
  const start=step<0?rnd(Math.abs(step)*6+100,9000):rnd(100,9999-step*6);
  const t=[0,1,2].map(i=>start+i*step),ans=start+3*step;
  return Q.num({
    prompt:`השלימו את המספר הבא בסדרה:<div class="seq">${m(t.map(fmt).join(' ,  ')+' ,  ___')}</div>`,
    answer:ans,
    hint:'בדקו בכמה משתנה כל מספר לעומת זה שלפניו – זו החוקיות.',
    explain:`החוקיות: הסדרה ${ruleText(step)} בכל פעם.<br>${m(t.concat(ans).map(fmt).join(' ,  '))}`
  });
}
function seqRule(){
  const step=pick([100,-10,10,-100,1000,-1000,50,-50]);
  const start=step<0?rnd(Math.abs(step)*5+100,9000):rnd(100,9999-step*5);
  const t=[0,1,2,3].map(i=>start+i*step);
  const others=shuffle([100,-100,10,-10,1000,-1000,50,-50].filter(x=>x!==step&&x!==-step));
  const opts=shuffle([step,-step,...others.slice(0,2)]);
  return Q.choice({
    prompt:`מה החוקיות של הסדרה?<div class="seq">${m(t.map(fmt).join(' ,  '))}</div>`,
    options:opts.map(ruleText),answer:opts.indexOf(step),
    hint:'חסרו מספר אחד מהמספר שאחריו. האם הסדרה עולה או יורדת?',
    explain:m(`${fmt(t[0])} ${step>0?'+':'−'} ${fmt(Math.abs(step))} = ${fmt(t[1])}`)+`<br>הסדרה ${ruleText(step)} בכל פעם.`
  });
}
function numLine(){
  const fine=Math.random()<0.45;
  const span=fine?100:1000,major=fine?10:100,minor=fine?5:50;
  const S=fine?rnd(10,98)*100:rnd(1,8)*1000;
  const val=fine?S+rnd(1,9)*10+(Math.random()<0.3?5:0):S+rnd(1,9)*100+(Math.random()<0.35?50:0);
  const X=v=>(20+(v-S)/span*320).toFixed(1);
  let g='';
  for(let v=S;v<=S+span;v+=minor){
    const maj=(v-S)%major===0;
    g+=`<line x1="${X(v)}" y1="${maj?30:35}" x2="${X(v)}" y2="${maj?50:45}" stroke="currentColor" stroke-width="${maj?2:1}"/>`;
    if(maj&&((v-S)/major)%2===0)g+=`<text x="${X(v)}" y="68" font-size="11" text-anchor="middle" fill="currentColor">${fmt(v)}</text>`;
  }
  const svg=`<svg viewBox="0 0 364 76" width="364" style="direction:ltr" role="img" aria-label="ישר מספרים"><line x1="10" y1="40" x2="352" y2="40" stroke="currentColor" stroke-width="2"/><polygon points="352,34 360,40 352,46" fill="currentColor"/>${g}<circle cx="${X(val)}" cy="40" r="7" class="dot"/><text x="${X(val)}" y="21" text-anchor="middle" font-size="17" font-weight="700" class="dotq">?</text></svg>`;
  const cands=uniq([val+major,val-major,val+minor,val-minor,val+2*major,val-2*major]).filter(v=>v>S&&v<S+span&&v!==val);
  const opts=shuffle([val,...shuffle(cands).slice(0,3)]);
  return Q.choice({
    prompt:'איזה מספר מסומן בנקודה האדומה על ישר המספרים?',visual:svg,
    options:opts.map(fmt),answer:opts.indexOf(val),
    hint:`בין שני קווים ארוכים יש ${major}. הקו הקצר באמצע מסמן ${minor}. התחילו מהמספר הכתוב הקרוב לנקודה וספרו בקפיצות.`,
    explain:`הנקודה נמצאת על ${m(fmt(val))}.`
  });
}

/* ================= 3. addition & subtraction ================= */
function addCarry(){
  let a,b;
  do{a=rnd(1000,5999);b=rnd(150,999);}while(!((a%10+b%10>=10)||(Math.floor(a/10)%10+Math.floor(b/10)%10>=10)));
  return Q.num({
    prompt:`פתרו בטור: ${m(`${fmt(a)} + ${b}`)}`,answer:a+b,grid:{a,b,op:'+'},
    hint:'מתחילים מהיחידות – העמודה הימנית. כשסכום עמודה עובר 9, כותבים למטה רק את ספרת היחידות, ואת ה-1 כותבים בריבוע הקטן שמעל העמודה הבאה.',
    explain:workedHTML(a,b,'+')+m(`${fmt(a)} + ${b} = ${fmt(a+b)}`)
  });
}
function subZero(){
  let a,b,split;
  const u=rnd(0,7),bu=rnd(u+1,9),bt=rnd(1,9);
  if(Math.random()<0.6){
    const H=rnd(2,9);a=H*100+u;b=rnd(1,H-1)*100+bt*10+bu;
    split=`${(H-1)*100} + 90 + ${u+10}`;
  }else{
    const H=rnd(1,5);a=H*1000+u;b=rnd(1,9)*100+bt*10+bu;
    split=`${fmt((H-1)*1000)} + 900 + 90 + ${u+10}`;
  }
  return Q.num({
    prompt:`פתרו בטור: ${m(`${fmt(a)} − ${b}`)}`,answer:a-b,grid:{a,b,op:'−'},
    hint:`האפסים הם המלכודת! כשצריך לפרוט, פורטים מהמקום הראשון שיש בו ספרה: ${m(`${fmt(a)} = ${split}`)}<br>את הספרה החדשה כותבים בריבוע הקטן שמעל הספרה, והישנה נמחקת מעצמה.`,
    explain:workedHTML(a,b,'−')+`בדיקה: ${m(`${fmt(a-b)} + ${b} = ${fmt(a)}`)}`
  });
}
function cmpNoSolve(){
  const a=rnd(120,499),b=rnd(120,499),x=rnd(400,999),y=rnd(11,99),t=rnd(0,4);
  let L,R,why;
  if(t===0){L=`${a} + ${b}`;R=`${a+1} + ${b-1}`;why=`ב-${m(R)} המספר הראשון גדל ב-1 והשני קטן ב-1 – הם "מתקזזים", אז הסכום לא משתנה.`;}
  else if(t===1){L=`${a} + ${b}`;R=`${a} + ${b+1}`;why=`המספר הראשון זהה, וב-${m(R)} מוסיפים 1 יותר – לכן הסכום שלו גדול יותר.`;}
  else if(t===2){L=`${x} − ${y}`;R=`${x} − ${y+1}`;why=`מתחילים מאותו מספר, אבל ב-${m(R)} מורידים יותר – אז נשאר פחות.`;}
  else if(t===3){L=`${x} − ${y}`;R=`${x+1} − ${y}`;why=`מורידים אותו דבר, אבל ב-${m(R)} מתחילים ממספר גדול יותר – אז נשאר יותר.`;}
  else{L=`${a} + ${b}`;R=`${b} + ${a}`;why='אותם מספרים בסדר הפוך – בחיבור הסדר לא משנה.';}
  if(Math.random()<0.5)[L,R]=[R,L];

function divisPick(){
  const k=pick([2,5,5,10]);

  while(wrong.length<3){const w=rnd(10,999);if(w%k!==0&&!wrong.includes(w))wrong.push(w);}
  const opts=shuffle([c,...wrong]);

/* ================= 6. order of operations ================= */
function opsGen(t){
  let e,ans,steps;
  if(t===0){const b=rnd(2,9),c=rnd(2,6),a=b*c+rnd(3,40),d=rnd(1,15);e=`${a} − ${b} × ${c} + ${d}`;ans=a-b*c+d;steps=[`${b} × ${c} = ${b*c}`,`${a} − ${b*c} = ${a-b*c}`,`${a-b*c} + ${d} = ${ans}`];}
  else if(t===1){const b=rnd(2,4),c=rnd(2,5),q=rnd(2,6),a=b*c*q,d=rnd(0,q);e=`${a} : (${b} × ${c}) − ${d}`;ans=q-d;steps=[`${b} × ${c} = ${b*c}`,`${a} : ${b*c} = ${q}`,`${q} − ${d} = ${ans}`];}
  else if(t===2){const a=rnd(5,30),b=rnd(2,9),c=rnd(2,9);e=`${a} + ${b} × ${c}`;ans=a+b*c;steps=[`${b} × ${c} = ${b*c}`,`${a} + ${b*c} = ${ans}`];}
  else if(t===3){const a=rnd(2,9),b=rnd(2,9),c=rnd(2,6);e=`(${a} + ${b}) × ${c}`;ans=(a+b)*c;steps=[`${a} + ${b} = ${a+b}`,`${a+b} × ${c} = ${ans}`];}
  else if(t===4){const d=rnd(2,5),k=rnd(2,6),c=d*k;let a,b;do{a=rnd(2,9);b=rnd(2,9);}while(a*b<=k);e=`${a} × ${b} − ${c} : ${d}`;ans=a*b-k;steps=[`${a} × ${b} = ${a*b}`,`${c} : ${d} = ${k}`,`${a*b} − ${k} = ${ans}`];}
  else{const a=rnd(30,90),b=rnd(3,15),c=rnd(2,12);e=`${a} − ${b} + ${c}`;ans=a-b+c;steps=[`${a} − ${b} = ${a-b}`,`${a-b} + ${c} = ${ans}`];}
  return Q.num({prompt:`פתרו: ${m(e+' =')}`,answer:ans,
    hint:'סדר הפעולות: 1) סוגריים 2) כפל וחילוק 3) חיבור וחיסור – משמאל לימין.'+(t===5?' כאן אין כפל – אז פשוט משמאל לימין, לפי הסדר!':''),
    explain:steps.map(s=>m(s)).join('<br>')});
}

function chartSVG(d){
  const x0=40,x1=332,y0=196,yT=22,mx=14,Y=v=>(y0-(v/mx)*(y0-yT)).toFixed(1);
  let s=`<svg viewBox="0 0 340 232" width="340" style="direction:ltr" role="img" aria-label="דיאגרמת עמודות של גולים">`;
  for(let v=0;v<=mx;v+=2)s+=`<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${x0-8}" y="${(+Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="currentColor">${v}</text>`;
  const slot=(x1-x0)/d.vals.length;
  d.vals.forEach((v,i)=>{const cx=x0+slot*i+slot/2;s+=`<rect x="${(cx-18).toFixed(1)}" y="${Y(v)}" width="36" height="${(y0-Y(v)).toFixed(1)}" class="bar"/><text x="${cx.toFixed(1)}" y="${y0+22}" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">${d.names[i]}</text>`;});
  s+=`<line x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}" stroke="currentColor" stroke-width="2"/>`;
  return s+'</svg>';
}
function chartQ(t){
  const names=shuffle(PLAYERS).slice(0,4),pool=shuffle(Array.from({length:14},(_,i)=>i+1));
  let vals;
  if(t===2){const s=pool.slice(0,3);vals=shuffle([...s,s[rnd(0,2)]]);}else vals=pool.slice(0,4);
  const visual=`<div class="qv-col"><div class="ct">כמה גולים הבקיע כל שחקן העונה?</div>${chartSVG({names,vals})}</div>`;
  const HINT='בדקו איפה נגמרת כל עמודה לעומת הקווים. עמודה שנגמרת בדיוק באמצע בין שני קווים – זה המספר שביניהם.';
  const mx=Math.max(...vals),mn=Math.min(...vals);
  if(t===0){const i=vals.indexOf(mx);return Q.choice({prompt:'מי הבקיע הכי הרבה גולים?',visual,options:names,answer:i,hint:'חפשו את העמודה הגבוהה ביותר.',explain:`${names[i]} – ${mx} גולים.`});}
  if(t===1){const i=vals.indexOf(mn);return Q.choice({prompt:'מי הבקיע הכי מעט גולים?',visual,options:names,answer:i,hint:'חפשו את העמודה הנמוכה ביותר.',explain:`${names[i]} – ${mn} גולים.`});}
  if(t===2){
    const pairs=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)pairs.push([i,j]);
    const good=pairs.find(([i,j])=>vals[i]===vals[j]);
    const opts=shuffle([good,...shuffle(pairs.filter(p=>p!==good)).slice(0,3)]);
    return Q.choice({prompt:'אילו שני שחקנים הבקיעו אותו מספר גולים?',visual,options:opts.map(([i,j])=>`${names[i]} ו${names[j]}`),answer:opts.indexOf(good),
      hint:'חפשו שתי עמודות באותו גובה בדיוק.',explain:`${names[good[0]]} ו${names[good[1]]} – לכל אחד ${vals[good[0]]} גולים.`});
  }
  if(t===3){const sum=vals.reduce((a,b)=>a+b,0);return Q.num({prompt:'כמה גולים הבקיעו כל השחקנים ביחד?',visual,answer:sum,hint:HINT+' אחר כך חברו את כל ארבעת המספרים.',explain:m(vals.join(' + ')+' = '+sum)});}
  const ord=[0,1,2,3].sort((a,b)=>vals[b]-vals[a]);const i=ord[rnd(0,1)],j=ord[rnd(2,3)];
  return Q.num({prompt:`בכמה גולים הבקיע ${names[i]} יותר מ${names[j]}?`,visual,answer:vals[i]-vals[j],
    hint:HINT+' ואז חסרו.',explain:`${names[i]}: ${vals[i]}, ${names[j]}: ${vals[j]}<br>${m(`${vals[i]} − ${vals[j]} = ${vals[i]-vals[j]}`)}`});
}

const f1=x=>(+x).toFixed(1);
function triSVG(T){
  const p=Math.random()<0.5?T.p.map(([x,y])=>[200-x,y]):T.p;
  let s=`<svg viewBox="0 0 200 160" width="200" role="img" aria-label="משולש"><polygon points="${p.map(q=>q.join(',')).join(' ')}" class="shape"/>`;
  T.t.forEach(i=>{
    const A=p[i],B=p[(i+1)%3],M=[(A[0]+B[0])/2,(A[1]+B[1])/2],d=unit(A,B),n=[-d[1],d[0]];
    [-3.5,3.5].forEach(o=>{const c=[M[0]+d[0]*o,M[1]+d[1]*o];s+=`<line x1="${f1(c[0]-n[0]*7)}" y1="${f1(c[1]-n[1]*7)}" x2="${f1(c[0]+n[0]*7)}" y2="${f1(c[1]+n[1]*7)}" class="tick"/>`;});
  });
  if(T.r>=0){
    const V=p[T.r],a=unit(V,p[(T.r+1)%3]),b=unit(V,p[(T.r+2)%3]),k=14;

function measCmp(){
  const t=rnd(0,5);let L,R,fact,unitName;
  if(t===0){const a=rnd(1,9),c=Math.random()<0.4?a*100:pick([a*10,a*100+pick([-50,50,10]),a*1000]);L={h:`${a} מ׳`,v:a*100};R={h:`${fmt(c)} ס״מ`,v:c};fact='1 מ׳ = 100 ס״מ';unitName='ס״מ';}
  else if(t===1){const x=pick([10,20,30,40,50]),mins=pick([90,70,80,100,60+x]);L={h:`${mins} דקות`,v:mins};R={h:`שעה ו-${x} דקות`,v:60+x};fact='שעה = 60 דקות';unitName='דקות';}
  else if(t===2){const h=pick([12,24,36,20]);L={h:'יממה',v:24};R={h:`${h} שעות`,v:h};fact='יממה = 24 שעות';unitName='שעות';}
  else if(t===3){const k=rnd(1,5),mm=pick([k*100,k*1000,k*1000+500,k*10]);L={h:`${fmt(mm)} מ׳`,v:mm};R={h:`${k} ק״מ`,v:k*1000};fact='1 ק״מ = 1,000 מ׳';unitName='מ׳';}
  else if(t===4){const k=rnd(1,5),g=pick([k*100,k*1000,k*1000+250]);L={h:`${k} ק״ג`,v:k*1000};R={h:`${fmt(g)} גרם`,v:g};fact='1 ק״ג = 1,000 גרם';unitName='גרם';}
  else{const w=rnd(1,3),d=pick([w*7,w*7+1,w*5,w*7-2]);L={h:w===1?'שבוע':w===2?'שבועיים':`${w} שבועות`,v:w*7};R={h:`${d} ימים`,v:d};fact='שבוע = 7 ימים';unitName='ימים';}
  if(Math.random()<0.5)[L,R]=[R,L];
  const s=sym(L.v,R.v),Lh=`<span class="w" dir="rtl">${L.h}</span>`,Rh=`<span class="w" dir="rtl">${R.h}</span>`;
  return Q.cmp({left:Lh,right:Rh,answer:s,
    hint:`זכרו: ${fact}. המירו את שני הצדדים לאותה יחידה ורק אז השוו.`,
    explain:`${L.h} = ${m(fmt(L.v))} ${unitName}<br>${R.h} = ${m(fmt(R.v))} ${unitName}`});
}
function measConv(){
  const t=rnd(0,5);
  if(t===0){const a=rnd(2,9);return Q.num({prompt:`כמה סנטימטרים יש ב-${a} מטרים?`,answer:a*100,hint:'במטר אחד יש 100 ס״מ.',explain:m(`${a} × 100 = ${a*100}`)+' ס״מ'});}
  if(t===1){const x=pick([5,10,15,20,25,30,40,45,50]);return Q.num({prompt:`כמה דקות יש בשעה ו-${x} דקות?`,answer:60+x,hint:'בשעה אחת יש 60 דקות.',explain:m(`60 + ${x} = ${60+x}`)+' דקות'});}
  if(t===2){const h=rnd(2,4);return Q.num({prompt:`כמה דקות יש ב-${h} שעות?`,answer:h*60,hint:'בכל שעה יש 60 דקות.',explain:m(`${h} × 60 = ${h*60}`)+' דקות'});}
  if(t===3){const k=rnd(2,9);return Q.num({prompt:`כמה מטרים הם ${k} קילומטרים?`,answer:k*1000,hint:'בקילומטר אחד יש 1,000 מטר.',explain:m(`${k} × 1,000 = ${fmt(k*1000)}`)+' מטר'});}
  if(t===4){const w=rnd(2,5);return Q.num({prompt:`כמה ימים יש ב-${w} שבועות?`,answer:w*7,hint:'בשבוע יש 7 ימים.',explain:m(`${w} × 7 = ${w*7}`)+' ימים'});}
  const Ln=pick([50,100]),n=Ln===100?pick([5,10,20]):pick([10,20,40]),ans=n*Ln;
  return Q.num({prompt:`שחקן רץ ${n} פעמים לאורך מגרש שאורכו ${Ln} מטר. כמה מטרים רץ בסך הכול?`,answer:ans,
    hint:`${n} פעמים ${Ln} מטר – זה כפל.`,explain:m(`${n} × ${Ln} = ${fmt(ans)}`)+' מטר'+(ans%1000===0?` – זה בדיוק ${ans/1000===1?'קילומטר אחד':ans/1000+' ק״מ'}!`:'')});
}
function measMatch(){
  const mins=pick([75,90,90,100,110,130,150,80]);
  const hs=h=>h===1?'שעה':h===2?'שעתיים':`${h} שעות`;
  const hm=(h,r)=>r===0?hs(h):`${hs(h)} ו-${r} דקות`;
  const h=Math.floor(mins/60),r=mins%60,correct=hm(h,r);
  const wrongs=uniq([`${Math.floor(mins/10)} שעות`,hm(h,(r+10)%60||10),hm(h+1,r),mins>=100?hm(1,mins-100):hm(h,(r+20)%60||20)]).filter(x=>x!==correct).slice(0,3);
  const opts=shuffle([correct,...wrongs]);
  return Q.choice({prompt:mins===90?'משחק כדורגל נמשך 90 דקות. כמה זמן זה?':`האימון נמשך ${mins} דקות. כמה זמן זה?`,
    options:opts,answer:opts.indexOf(correct),wide:true,
    hint:'בשעה יש 60 דקות (לא 100!). כמה שעות שלמות נכנסות, וכמה דקות נשארות?',
    explain:m(`${mins} = 60${h===2?' + 60':''} + ${r}`)+` → ${correct}`});
}

const NATIVE_RANDOM=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seeded(seed,fn){Math.random=mulberry32(seed);try{return fn();}finally{Math.random=NATIVE_RANDOM;}}
const newSeed=()=>Math.floor(NATIVE_RANDOM()*4294967296);

function gridDims(a,b,op){
  a=Number(a);b=Number(b);
  if(op==='×'&&b>=10&&a<10)[a,b]=[b,a];
  const A=String(a),B=String(b);
  return {a,b,A,B,W:op==='+'?Math.max(A.length,B.length)+1:op==='−'?A.length:A.length+B.length};
}
const helperOn=(g,p)=>g.op==='−'?p<g.A.length:p>=1;
function makeGrid(a,b,op,mode){
  const d=gridDims(a,b,op);
  return Object.assign(d,{id:'nb'+(++gridSeq),op,mode,car:Array(d.W).fill(''),res:Array(d.W).fill(''),sel:{r:'res',p:0},bad:-1,locked:false});
}
/* the correct carries / borrows, column by column */
function columnPlan(a,b,op){
  const g=gridDims(a,b,op),{A,B,W}=g,car=Array(W).fill(''),res=Array(W).fill('');
  const v=op==='+'?g.a+g.b:op==='−'?g.a-g.b:g.a*g.b,V=String(v);
  for(let p=0;p<V.length;p++)res[p]=digitAt(V,p);
  if(op==='+'){const L=Math.max(A.length,B.length);let c=0;for(let p=0;p<L;p++){const s=(+digitAt(A,p)||0)+(+digitAt(B,p)||0)+c;c=Math.floor(s/10);if(c&&p+1<L)car[p+1]=String(c);}}
  else if(op==='×'){let c=0;for(let p=0;p<A.length;p++){const s=(+digitAt(A,p))*g.b+c;c=Math.floor(s/10);if(c&&p+1<A.length)car[p+1]=String(c);}}
  else{
    const t=[...A].reverse().map(Number),ch=Array(A.length).fill(false);
    for(let p=0;p<A.length;p++){
      const d=+digitAt(B,p)||0;
      if(t[p]<d){let j=p+1;while(t[j]===0)j++;t[j]--;ch[j]=true;for(let k=j-1;k>p;k--){t[k]=9;ch[k]=true;}t[p]+=10;ch[p]=true;}
      if(ch[p])car[p]=String(t[p]);
    }
  }
  return Object.assign(g,{op,v,car,res});
}
const nc=(inner,cls='')=>`<span class="nc ${cls}">${inner}</span>`;
function nbHTML(g){
  let h=`<div class="nbwrap"><div class="nb" id="${g.id}" dir="ltr" role="group" aria-label="תרגיל בטור: ${g.a} ${g.op} ${g.b}" style="--cols:${g.W+1}">`+nc('');
  for(let p=g.W-1;p>=0;p--)h+=nc(helperOn(g,p)?`<button type="button" class="cell hp" data-r="car" data-p="${p}" aria-label="${g.op==='−'?'פריטה: ספרה חדשה מעל '+placeThe(p):'העברה לעמודת '+placeThe(p)}"></button>`:'','hw');
  h+=nc('');
  for(let p=g.W-1;p>=0;p--)h+=`<span class="nc dg" data-top="${p}">${digitAt(g.A,p)}</span>`;
  h+=nc(g.op,'dg op');
  for(let p=g.W-1;p>=0;p--)h+=nc(digitAt(g.B,p),'dg');
  h+=nc('','rl');
  for(let p=g.W-1;p>=0;p--)h+=nc(`<button type="button" class="cell rc" data-r="res" data-p="${p}" aria-label="ספרת ${placeThe(p)} בתוצאה"></button>`,'rl');
  return h+'</div></div>';
}
function workedHTML(a,b,op){
  const P=columnPlan(a,b,op),{A,B,W,car,res}=P;
  let h=`<div class="nbwrap"><div class="nb show" dir="ltr" role="img" aria-label="${P.a} ${op} ${P.b} = ${P.v}" style="--cols:${W+1}">`+nc('');
  for(let p=W-1;p>=0;p--)h+=nc(car[p],'hw pen'+(car[p].length>1?' two':''));
  h+=nc('');
  for(let p=W-1;p>=0;p--)h+=nc(digitAt(A,p),'dg'+(op==='−'&&car[p]?' struck':''));
  h+=nc(op,'dg op');
  for(let p=W-1;p>=0;p--)h+=nc(digitAt(B,p),'dg');
  h+=nc('','rl');
  for(let p=W-1;p>=0;p--)h+=nc(res[p],'rl dg pen');
  return h+'</div></div>';
}
function paintGrid(g){
  const el=document.getElementById(g.id);if(!el)return;
  el.querySelectorAll('button[data-r]').forEach(b=>{
    const r=b.dataset.r,p=+b.dataset.p,v=(r==='car'?g.car:g.res)[p];
    if(b.textContent!==v)b.textContent=v;
    b.classList.toggle('sel',!g.locked&&g.sel.r===r&&g.sel.p===p);
    b.classList.toggle('bad',r==='res'&&g.bad===p);
    b.classList.toggle('two',v.length>1);
    b.classList.toggle('on',v!=='');
    b.disabled=g.locked;
  });
  if(g.op==='−')el.querySelectorAll('[data-top]').forEach(s=>s.classList.toggle('struck',g.car[+s.dataset.top]!==''));
}
function wireGrid(g){
  const el=document.getElementById(g.id);if(!el)return;
  el.addEventListener('click',e=>{const b=e.target.closest('button[data-r]');if(!b||g.locked)return;g.sel={r:b.dataset.r,p:+b.dataset.p};curGrid=g;paintGrid(g);});
  paintGrid(g);
}
function moveSel(g,dir){
  let {r,p}=g.sel;
  if(dir==='U'){if(helperOn(g,p))r='car';}
  else if(dir==='D')r='res';
  else{const step=dir==='L'?1:-1;let np=p+step;while(r==='car'&&np>=0&&np<g.W&&!helperOn(g,np))np+=step;if(np>=0&&np<g.W)p=np;}
  g.sel={r,p};
}
function gridKey(g,k){
  if(g.locked)return;
  curGrid=g;
  const {r,p}=g.sel,arr=r==='car'?g.car:g.res;
  if(/^\d$/.test(k)){
    if(r==='res'){g.res[p]=k;if(g.bad===p)g.bad=-1;if(p<g.W-1)g.sel={r:'res',p:p+1};}
    else if(g.op==='−')g.car[p]=g.car[p]==='1'?'1'+k:k;
    else{g.car[p]=k;g.sel={r:'res',p};}
  }else if(k==='del'){
    if(arr[p]!==''){arr[p]=arr[p].slice(0,-1);if(r==='res'&&g.bad===p)g.bad=-1;}
    else if(r==='res'&&p>0){g.sel={r:'res',p:p-1};g.res[p-1]='';if(g.bad===p-1)g.bad=-1;}
  }else if(k==='clr'){g.car.fill('');g.res.fill('');g.bad=-1;g.sel={r:'res',p:0};}
  else moveSel(g,k);
  paintGrid(g);
}
function gridValue(g){
  let s='',started=false,gap=false;
  for(let p=g.W-1;p>=0;p--){const d=g.res[p];if(d===''){if(started)gap=true;}else{if(gap)break;started=true;s+=d;}}
  if(!started)return {empty:true};
  if(gap)return {gap:true};
  return {v:Number(s)};
}
function firstBadCol(g,ans){
  const S=String(ans);
  for(let p=0;p<g.W;p++){const e=digitAt(S,p),v=g.res[p];if(v===e)continue;if(e===''&&(v===''||v==='0'))continue;return p;}
  return -1;
}
function padHTML(g){
  return `<div class="pad" dir="ltr" data-g="${g.id}">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button type="button" class="key" data-k="${d}">${d}</button>`).join('')}<button type="button" class="key del" data-k="del" aria-label="מחיקת ספרה">⌫</button>${g.mode==='answer'?'<button type="button" class="kick padkick" data-k="ok">בעיטה ⚽</button>':'<button type="button" class="key clr" data-k="clr">ניקוי הטור</button>'}</div>`;
}
function wirePad(g){
  const el=document.querySelector(`.pad[data-g="${g.id}"]`);if(!el)return;
  el.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b||b.disabled)return;const k=b.dataset.k;if(k==='ok')return submitGrid();gridKey(g,k);});
}
function onGridKeydown(e){
  const g=curGrid;
  if(!g||g.locked||!document.getElementById(g.id))return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(e.key==='Enter'){if(g.mode==='answer'){e.preventDefault();submitGrid();}return;}
  const map={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',Backspace:'del',Delete:'del'};
  const k=/^\d$/.test(e.key)?e.key:map[e.key];
  if(!k)return;
  e.preventDefault();gridKey(g,k);
}

function wireScratch(defOp){
  let op=defOp;
  const box=$('#scr'),btn=$('#scrBtn');
  btn.onclick=()=>{box.hidden=!box.hidden;btn.setAttribute('aria-expanded',String(!box.hidden));if(!box.hidden){if(G.scratch)curGrid=G.scratch;else $('#sa').focus();}};
  box.querySelectorAll('.opb').forEach(b=>b.onclick=()=>{op=b.dataset.op;box.querySelectorAll('.opb').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
  const build=()=>{
    const msg=$('#scrMsg'),a=clean($('#sa').value),b=clean($('#sb').value);
    msg.textContent='';
    if(!a||!b){msg.textContent='כתבו מספר בכל אחת משתי המשבצות.';return;}
    if(!/^\d{1,5}$/.test(a)||!/^\d{1,5}$/.test(b)){msg.textContent='רק מספרים שלמים, עד 5 ספרות.';return;}
    const x=+a,y=+b;
    if(op==='−'&&x<y){msg.textContent='בחיסור בטור המספר הגדול כתוב למעלה. החליפו ביניהם.';return;}
    if(op==='×'&&x>=10&&y>=10){
      const L=Math.max(x,y),s=Math.min(x,y);
      msg.innerHTML=s%10===0?`בטור כופלים במספר של ספרה אחת. חשבו ${m(`${L} × ${s/10}`)}, ואז הוסיפו 0 בסוף.`:`בטור כופלים במספר של ספרה אחת. פרקו: ${m(`${L} × ${s} = ${L} × ${s-s%10} + ${L} × ${s%10}`)}`;
      return;
    }
    const g=makeGrid(x,y,op,'scratch');G.scratch=g;
    $('#scrWork').innerHTML=nbHTML(g)+padHTML(g);
    wireGrid(g);wirePad(g);curGrid=g;
  };
  $('#sgo').onclick=build;
  ['#sa','#sb'].forEach(s=>{$(s).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();build();}};});
}

/* ================= progress: saved on the device and in the account ================= */
const STORE_KEY='mathLeague.v2',OLD_KEY='mathLeague.v1',LOG_MAX=80;
const blank=()=>({v:2,name:'',named:false,best:{},cup:null,gen:{},st:{},log:[],days:{},cur:null,upd:0,ep:0});
let store=blank();
function loadStore(){
  try{
    const s=localStorage.getItem(STORE_KEY);
    if(s){store=Object.assign(blank(),JSON.parse(s));return;}
    const o=localStorage.getItem(OLD_KEY);
    if(o){const x=JSON.parse(o);store=Object.assign(blank(),{name:x.name||'',named:!!x.named,best:x.best||{},cup:x.cup==null?null:x.cup});}
  }catch(e){}
}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}}
function saveStore(){store.upd=Date.now();saveLocal();Sync.push();}
function mergeStores(L,R){
  const N=(R.upd||0)>(L.upd||0)?R:L,O=N===R?L:R;
  const epL=L.ep||0,epR=R.ep||0;
  if(epL!==epR)return Object.assign(blank(),JSON.parse(JSON.stringify(epL>epR?L:R)));   // a reset on one side wins outright
  const M=Object.assign(blank(),JSON.parse(JSON.stringify(N)));
  for(const k of Object.keys(O.best||{}))M.best[k]=Math.max(M.best[k]||0,O.best[k]||0);
  if(O.cup!=null)M.cup=M.cup==null?O.cup:Math.max(M.cup,O.cup);
  if(!M.name&&O.name)M.name=O.name;
  M.named=!!(L.named||R.named);
  for(const k of Object.keys(O.gen||{}))if(!M.gen[k])M.gen[k]=O.gen[k];
  for(const k of Object.keys(O.st||{}))if(!M.st[k])M.st[k]=O.st[k];
  for(const k of Object.keys(O.days||{}))M.days[k]=Math.max(M.days[k]||0,O.days[k]||0);
  const seen=new Set(M.log.map(e=>e.t));
  (O.log||[]).forEach(e=>{if(!seen.has(e.t))M.log.push(e);});
  M.log.sort((x,y)=>y.t-x.t);M.log=M.log.slice(0,LOG_MAX);
  return M;
}
/* ---- where progress is kept: the claude.ai account (db), or a Supabase project for the self-hosted copy ---- */
const CFG=(typeof window!=='undefined'&&window.LEAGUE_CONFIG)||{};
const CLOUD=!!(CFG.supabaseUrl&&CFG.supabaseKey);
const PLAYER_KEY='mathLeague.player',PC_ALPHA='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function newPlayerCode(){const b=new Uint8Array(12);crypto.getRandomValues(b);let t='';for(const x of b)t+=PC_ALPHA[x&31];return t.slice(0,4)+'-'+t.slice(4,8)+'-'+t.slice(8);}
function normCode(t){const x=String(t||'').toUpperCase().replace(/[\s\-–_.]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');return /^[0-9A-HJKMNP-TV-Z]{12}$/.test(x)?x.slice(0,4)+'-'+x.slice(4,8)+'-'+x.slice(8):null;}
const getPlayer=()=>{try{return normCode(localStorage.getItem(PLAYER_KEY));}catch(e){return null;}};
const setPlayer=c=>{try{localStorage.setItem(PLAYER_KEY,c);}catch(e){}};
const playerLink=c=>location.origin+location.pathname+'#p='+c;
async function sbCall(fn,args){
  const h={'Content-Type':'application/json',apikey:CFG.supabaseKey};
  if(/^eyJ/.test(CFG.supabaseKey))h.Authorization='Bearer '+CFG.supabaseKey;   // legacy anon keys are JWTs; sb_publishable_ keys go in apikey only
  let r;
  try{r=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});}
  catch(e){const x=new Error('network');x.code='unavailable';throw x;}
  if(!r.ok){const x=new Error('http '+r.status);x.status=r.status;x.code=(r.status>=500||r.status===408||r.status===429)?'unavailable':'refused';throw x;}
  const t=await r.text();return t?JSON.parse(t):null;
}
const serverBackend=code=>({kind:'server',code,load:()=>sbCall('get_progress',{p_code:code}),save:d=>sbCall('save_progress',{p_code:code,p_data:d})});
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const Sync={
  be:null,state:'local',timer:null,busy:false,dirty:false,retried:false,lastPull:0,
  async init(){
    if(CLOUD){const pc=getPlayer();if(!pc||!store.named){paintSync();return;}this.be=serverBackend(pc);this.state='connecting';paintSync();return this.push(true);}
    const c=window.claude;
    if(!c||typeof c.use!=='function')return;
    this.state='connecting';paintSync();
    try{
      const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
      const uid=db&&user?await user.id():null;
      if(!uid){this.state='local';paintSync();return;}
      const ref=db.doc('data/users/'+uid+'/progress');
      this.be={kind:'account',load:async()=>{const snap=await ref.get();return snap.exists?JSON.parse(JSON.stringify(snap.data())):null;},save:d=>ref.set(d)};
    }catch(e){this.state='local';paintSync();return;}
    this.push(true);
  },
  push(now){
    if(!this.be)return;
    this.dirty=true;clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.flush(),now?0:1200);
  },
  /* every save first reads what the other devices saved and merges it in, then writes the result */
  async flush(){
    if(!this.be||this.busy||!this.dirty)return;
    const be=this.be;
    this.busy=true;this.dirty=false;if(this.state!=='connecting')this.state='saving';paintSync();
    let ok=false;
    try{
      const remote=await be.load();
      if(be!==this.be)throw Object.assign(new Error('switched'),{code:'switched'});
      if(remote&&remote.v===2){
        const cur=store.cur,before=canon(sanitizeStore(store));
        store=mergeStores(store,sanitizeStore(remote));store.cur=cur;saveLocal();
        if(canon(sanitizeStore(store))!==before)onRemoteMerged();
      }
      await be.save(JSON.parse(JSON.stringify(store)));
      ok=true;this.state='cloud';this.retried=false;this.lastPull=Date.now();
    }catch(e){
      const code=e&&e.code;
      if(code==='switched'){ok=true;this.dirty=true;}
      else if(be.kind==='account'&&['revoked','not_granted','capability_disabled','capability_removed','invalid_argument','transform_error'].includes(code)){this.be=null;this.state='local';}
      else if(code==='unavailable'&&!this.retried){this.retried=true;this.dirty=true;this.state='saving';setTimeout(()=>{this.busy||this.flush();},2000+NATIVE_RANDOM()*2000);}
      else{this.dirty=true;this.state='error';}
    }
    this.busy=false;paintSync();
    if(ok&&this.dirty&&this.be)this.flush();
  },
  flushNow(){if(this.be&&this.dirty){clearTimeout(this.timer);this.flush();}},
  refresh(){if(this.be&&!this.busy&&Date.now()-this.lastPull>30000)this.push(true);}
};
function paintSync(){

function slimStore(){
  const days={};Object.keys(store.days).sort().slice(-60).forEach(k=>days[k]=store.days[k]);
  return {v:2,name:store.name,named:true,best:store.best,cup:store.cup,gen:store.gen,st:store.st,log:store.log.slice(0,30),days,upd:store.upd,ep:store.ep};
}
const b64u={
  enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec:str=>{let t=str.replace(/-/g,'+').replace(/_/g,'/');t+='='.repeat((4-t.length%4)%4);const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
};
const canZip=()=>typeof CompressionStream==='function'&&typeof DecompressionStream==='function'&&typeof Response==='function'&&typeof Blob==='function';
async function pipeBytes(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());}
async function makeCode(){
  const bytes=new TextEncoder().encode(JSON.stringify(slimStore()));
  if(canZip()){try{return 'LM1.'+b64u.enc(await pipeBytes(bytes,new CompressionStream('deflate-raw')));}catch(e){}}
  return 'LM0.'+b64u.enc(bytes);
}
function sanitizeStore(o){
  const ids=new Set(STATIONS.map(x=>x.id)),num=(x,lo,hi)=>{x=Math.floor(Number(x));return Number.isFinite(x)?Math.min(hi,Math.max(lo,x)):lo;};
  const S=blank();
  S.name=String(o.name||'').slice(0,16);S.named=true;
  for(const [k,v] of Object.entries(o.best||{}))if(ids.has(k))S.best[k]=num(v,0,3);
  S.cup=o.cup==null?null:num(o.cup,0,12);
  for(const [k,v] of Object.entries(o.gen||{}))if(/^[a-z]+\.\d{1,2}$/.test(k)&&genByKey(k)&&v&&/^[01r]{0,8}$/.test(v.h||''))S.gen[k]={n:num(v.n,0,1e6),h:v.h||''};
  for(const [k,v] of Object.entries(o.st||{}))if(ids.has(k)&&v)S.st[k]={g:num(v.g,0,1e6),k:num(v.k,0,1e7),f:num(v.f,0,1e7),t:num(v.t,0,4e12)};
  (Array.isArray(o.log)?o.log:[]).slice(0,LOG_MAX).forEach(e=>{if(e&&['station','cup','redo'].includes(e.m))S.log.push({t:num(e.t,0,4e12),m:e.m,s:ids.has(e.s)?e.s:null,go:num(e.go,0,99),n:num(e.n,0,99),p:num(e.p,0,99),tr:num(e.tr,0,3)});});
  for(const [k,v] of Object.entries(o.days||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(k))S.days[k]=num(v,0,1e6);
  S.upd=num(o.upd,0,4e12);S.ep=num(o.ep,0,4e12);
  return S;
}
async function readCode(txt){
  const s=String(txt).replace(/\s+/g,''),hit=/^LM([01])\.([A-Za-z0-9_-]+)$/.exec(s);
  if(!hit)throw new Error('format');
  let bytes=b64u.dec(hit[2]);
  if(hit[1]==='1'){if(!canZip())throw new Error('nozip');bytes=await pipeBytes(bytes,new DecompressionStream('deflate-raw'));}
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o||o.v!==2||typeof o.best!=='object')throw new Error('shape');
  return sanitizeStore(o);
}
function importStore(inc){
  inc.ep=Math.max(inc.ep||0,store.ep||0);           // an explicit load is never blocked by an earlier reset here
  const cur=store.cur;store=mergeStores(store,inc);store.cur=cur;
  if(!store.name)store.name=inc.name;store.named=true;

}

/* ---- stats ---- */
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function streak(){let n=0;const d=new Date();if(!store.days[dayKey(d)])d.setDate(d.getDate()-1);while(store.days[dayKey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function pruneDays(){const ks=Object.keys(store.days).sort();while(ks.length>120)delete store.days[ks.shift()];}
function genByKey(gk){const [sid,ix]=String(gk).split('.');const st=STATIONS.find(s=>s.id===sid);if(!st)return null;const gen=st.gens[+ix];return gen?{st,gen}:null;}
const firstRate=h=>{const r=h.slice(-4);return r?(r.split('1').length-1)/r.length:1;};
function isWeak(r){if(!r||!r.h)return false;if(r.h.slice(-1)!=='1')return true;const rec=r.h.slice(-4);return rec.length>=2&&firstRate(rec)<0.5;}
function weakKeys(){
  const sc=k=>{const h=store.gen[k].h,l=h.slice(-1);return (l==='0'?0:l==='r'?1:2)+firstRate(h);};
  return Object.keys(store.gen).filter(k=>genByKey(k)&&isWeak(store.gen[k])).sort((a,b)=>sc(a)-sc(b));
}
const accOf=id=>{const s=store.st[id];return s&&s.k?s.f/s.k:0;};
function recommend(){
  const unplayed=STATIONS.find(s=>!store.st[s.id]);
  if(unplayed)return unplayed.id;
  const c=STATIONS.filter(s=>(store.best[s.id]||0)<3);
  if(!c.length)return 'cup';
  c.sort((a,b)=>((store.best[a.id]||0)-(store.best[b.id]||0))||(accOf(a.id)-accOf(b.id)));
  return c[0].id;
}
const trophyOf=p=>p>=9?3:p>=7?2:p>=4?1:0;
function recordKick(item,ok,first){
  const r=store.gen[item.gk]||(store.gen[item.gk]={n:0,h:''});
  r.n++;r.h=(r.h+(ok?(first?'1':'r'):'0')).slice(-8);
  const s=store.st[item.st.id]||(store.st[item.st.id]={g:0,k:0,f:0,t:0});
  s.k++;if(ok&&first)s.f++;s.t=Date.now();
  const d=dayKey();store.days[d]=(store.days[d]||0)+1;pruneDays();
}
function recordGameEnd(){
  const e={t:Date.now(),m:G.mode,s:G.sid||null,go:G.goals,n:G.qs.length,p:G.points};
  if(G.mode==='station'){
    G.tr=trophyOf(G.points);G.prevBest=store.best[G.sid]||0;e.tr=G.tr;
    if(G.tr>G.prevBest)store.best[G.sid]=G.tr;
    const s=store.st[G.sid];if(s)s.g=(s.g||0)+1;
  }
  if(G.mode==='cup'){G.isRec=store.cup==null||G.goals>store.cup;if(G.isRec)store.cup=G.goals;}
  store.log.unshift(e);store.log=store.log.slice(0,LOG_MAX);
  store.cur=null;saveStore();
}
function saveCur(){
  store.cur={m:G.mode,s:G.sid||null,it:G.qs.map(x=>[x.gk,x.seed]),i:G.results.length,go:G.goals,sv:G.saves,p:G.points,r:G.results.slice(),ms:G.missed.slice()};
  saveStore();
}

    <div class="toast" id="joinMsg" aria-live="polite">${err||''}</div></section>
  <div class="endbtns"><button class="ghost" id="home">${store.named?'חזרה לטבלת הליגה':'חזרה'}</button></div>`;
  $('#home').onclick=()=>store.named?renderHome():renderName();
  const copy=async(text,label)=>{let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(e){}
    if(!ok){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy');}catch(e){}ta.remove();}
    $('#copyMsg').textContent=ok?`${label} הועתק ✓`:`לא הצלחתי להעתיק. הקוד: ${pc}`;};
  if(pc){$('#copyLink').onclick=()=>copy(playerLink(pc),'הקישור');$('#copyCode').onclick=()=>copy(pc,'הקוד');}
  const join=async()=>{
    const msg=$('#joinMsg'),code=normCode($('#pcIn').value);msg.classList.remove('ok');
    if(!code){msg.textContent='הקוד לא שלם. יש בו 12 אותיות ומספרים, למשל K7QM-2XRA-9TPD.';return;}
    if(code===pc){msg.textContent='זה כבר הקוד של המכשיר הזה.';return;}
    $('#join').disabled=true;msg.textContent='מחפש…';
    const r=await joinWithCode(code);$('#join').disabled=false;
    if(r.ok)return renderHome();
    msg.textContent=r.err==='missing'?'לא מצאנו שחקן עם הקוד הזה. בדקו את האותיות והמספרים.':r.err==='net'?'אין חיבור לשרת כרגע. נסו שוב בעוד רגע.':'';
  };
  $('#join').onclick=join;
  $('#pcIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();join();}};
  window.scrollTo(0,0);
}
function buildItem(gk,seed){const x=genByKey(gk);return {q:seeded(seed,()=>makeQ(x.gen)),st:x.st,gk,seed};}
function startGame(mode,sid,gks){
  G={mode,sid,qs:gks.map(gk=>buildItem(gk,newSeed())),i:0,goals:0,saves:0,points:0,results:[],missed:[]};
  saveCur();renderQ();
}
function startStation(id){
  const st=STATIONS.find(s=>s.id===id),order=shuffle(st.gens.map((_,i)=>st.id+'.'+i)),gks=[];
  for(let i=0;i<5;i++)gks.push(order[i%order.length]);
  startGame('station',id,gks);
}
function startCup(){
  const extra=rnd(0,STATIONS.length-1),gks=[],one=st=>st.id+'.'+rnd(0,st.gens.length-1);
  STATIONS.forEach((st,k)=>{gks.push(one(st));if(k===extra)gks.push(one(st));});
  startGame('cup',null,gks);
}
function startRedo(){
  const w=weakKeys();if(!w.length)return renderHome();
  const n=Math.min(5,Math.max(3,w.length)),gks=[];
  for(let i=0;i<n;i++)gks.push(w[i%w.length]);
  startGame('redo',null,shuffle(gks));
}
function resumeGame(){
  const c=store.cur;
  try{
    const qs=c.it.map(([gk,seed])=>{if(!genByKey(gk))throw new Error('gen');return buildItem(gk,seed);});
    if(c.i>=qs.length)throw new Error('done');
    G={mode:c.m,sid:c.s,qs,i:c.i,goals:c.go,saves:c.sv,points:c.p,results:c.r.slice(),missed:c.ms.slice()};
    renderQ();
  }catch(e){store.cur=null;saveStore();renderHome();}
}
function topbar(){
  const dots=G.qs.map((_,i)=>{const r=G.results[i];return `<i class="${r==='goal'||r==='reb'?'g':r==='save'?'s':i===G.i?'c':''}"></i>`;}).join('');
  return `<div class="top"><button class="exit" id="exit" aria-label="יציאה לטבלת הליגה (המשחק נשמר)">✕</button><div class="score"><span class="t">${esc(store.name||'אני')}</span><span class="d" dir="ltr"><b id="ss">${G.saves}</b>:<b id="sg">${G.goals}</b></span><span class="t">השוער</span></div></div><div class="kicks" aria-label="בעיטה ${G.i+1} מתוך ${G.qs.length}">${dots}</div>`;
}
function wireTop(){$('#exit').onclick=renderHome;}
const maxAttempts=q=>G.mode==='cup'?1:((q.kind==='choice'&&q.options.length<=3)||q.kind==='cmp')?1:2;
function answerArea(q){
  if(q.kind==='choice')return `<div class="opts ${q.wide?'wide':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  if(q.kind==='cmp')return `<div class="cmpx" dir="ltr"><span>${q.left}</span><span class="cbox" id="cbox" aria-label="ריבוע"></span><span>${q.right}</span></div><div class="opts sym" dir="ltr">${['<','>','='].map(s=>`<button class="opt" data-s="${s}" aria-label="${s==='<'?'קטן מ':s==='>'?'גדול מ':'שווה'}">${symH(s)}</button>`).join('')}</div>`;
  const numeric=q.kind!=='text';
  return `<div class="ans"><input id="inp" ${numeric?'inputmode="numeric" dir="ltr"':'dir="rtl"'} autocomplete="off" autocorrect="off" spellcheck="false" aria-label="התשובה שלך" placeholder="${numeric?'?':'המילה'}"><button class="kick" id="kick">בעיטה ⚽</button></div><div class="toast" id="toast" aria-live="polite"></div>`;
}
function renderQ(){
  screen='game';
  const {q,st}=G.qs[G.i];G.attempt=0;G.locked=false;G.scratch=null;curGrid=null;
  G.grid=q.grid?makeGrid(q.grid.a,q.grid.b,q.grid.op,'answer'):null;
  const cup=G.mode==='cup',sop=!q.grid&&SCRATCH[st.id];
  const meta=G.mode==='redo'?`🔁 חזרה על טעויות: ${st.name}`:`${st.icon} ${st.name}`;
  const tools=(cup?'':'<button class="hint-btn" id="hintBtn" aria-expanded="false" aria-controls="hint">📋 טיפ מהמאמן</button>')+(sop?'<button class="hint-btn" id="scrBtn" aria-expanded="false" aria-controls="scr">📝 טיוטה בטור</button>':'');
  app.innerHTML=`<div id="tb">${topbar()}</div>
  <main class="card">
    <div class="q-meta">${meta}</div>
    <div class="q-prompt">${q.prompt}</div>
    ${q.visual?`<div class="q-visual">${q.visual}</div>`:''}
    ${G.grid?nbHTML(G.grid)+padHTML(G.grid)+'<div class="toast" id="toast" aria-live="polite"></div>':answerArea(q)}
    <div class="fb" id="fb" aria-live="polite"></div>
    ${tools?`<div class="tools">${tools}</div>`:''}
    ${cup?'':`<div class="hint" id="hint" hidden>${q.hint}</div>`}
    ${sop?scratchBox(sop):''}
  </main>`;
  wireTop();
  if(G.grid){wireGrid(G.grid);wirePad(G.grid);curGrid=G.grid;}
  else if(q.kind==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(b.dataset.i,b));
  else if(q.kind==='cmp')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{$('#cbox').innerHTML=symH(b.dataset.s);submit(b.dataset.s,b);});
  else{
    const inp=$('#inp');
    $('#kick').onclick=()=>submit(inp.value);
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit(inp.value);}};
  }
  const hb=$('#hintBtn');
  if(hb)hb.onclick=()=>{const h=$('#hint');h.hidden=!h.hidden;hb.setAttribute('aria-expanded',String(!h.hidden));};
  if(sop)wireScratch(sop);
  window.scrollTo(0,0);
}
function judge(q,val){
  if(q.kind==='num'){if(!isInt(val))return null;return Number(clean(val))===q.answer;}
  if(q.kind==='text')return normHe(val)===normHe(q.answer);
  if(q.kind==='open')return !!q.check(val);
  if(q.kind==='choice')return Number(val)===q.answer;
  if(q.kind==='cmp')return val===q.answer;
  return false;
}
function submitGrid(){
  if(!G||G.locked||!G.grid)return;
  const r=gridValue(G.grid),t=$('#toast');
  if(r.empty){t.textContent='כתבו את התוצאה במשבצות שמתחת לקו.';return;}
  if(r.gap){t.textContent='חסרה ספרה. ממלאים כל עמודה, מהיחידות (מימין) שמאלה.';return;}
  submit(String(r.v));
}
function submit(val,btn){
  if(G.locked)return;
  const {q}=G.qs[G.i];
  const typed=q.kind==='num'||q.kind==='text'||q.kind==='open';
  if(typed&&!String(val).trim()){$('#toast').textContent='קודם כותבים תשובה, ואז בועטים.';return;}
  const ok=judge(q,val);
  if(ok===null){$('#toast').textContent='כאן צריך לכתוב מספר – רק ספרות.';return;}
  if(typed)$('#toast').textContent='';
  G.attempt++;
  if(ok){if(btn)btn.classList.add('right');if(q.kind==='cmp')$('#cbox').classList.add('ok');return finish(true);}
  if(btn){btn.classList.add('wrong');btn.disabled=true;}
  if(G.attempt<maxAttempts(q)){
    let say='יש לכם עוד ניסיון. הנה טיפ מהמאמן:';
    if(G.grid){const p=firstBadCol(G.grid,q.answer);if(p>=0){G.grid.bad=p;G.grid.sel={r:'res',p};curGrid=G.grid;paintGrid(G.grid);say=`יש טעות בעמודת ${placeThe(p)}. תקנו ובעטו שוב. הנה טיפ מהמאמן:`;}}
    $('#fb').innerHTML=`<div class="panel post"><h3>${pick(POST_MSG)}</h3>${say}</div>`;
    const h=$('#hint');if(h){h.hidden=false;$('#hintBtn').setAttribute('aria-expanded','true');}
    if(typed&&!G.grid){const inp=$('#inp');if(inp){inp.value='';inp.focus();}}
    return;
  }
  if(q.kind==='cmp')$('#cbox').classList.add('no');
  finish(false);
}
function answerHTML(q){
  if(q.kind==='num')return m(fmt(q.answer));
  if(q.kind==='text')return `<b>${q.answer}</b>`;
  if(q.kind==='open')return 'למשל '+m(q.sample);
  if(q.kind==='choice')return `<b>${q.options[q.answer]}</b>`;
  return `<span class="m" dir="ltr">${q.left} ${symH(q.answer)} ${q.right}</span>`;
}
function goalFlash(){
  if(reduced())return;
  const d=document.createElement('div');d.className='goalflash';d.innerHTML='<span>גול! ⚽</span>';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}
function finish(ok){
  G.locked=true;
  const item=G.qs[G.i],{q,st}=item,first=G.attempt===1;
  let head,cls;
  if(ok){
    G.points+=first?2:1;G.goals++;G.results[G.i]=first?'goal':'reb';
    head=first?pick(GOAL_MSG):'גול בריבאונד! (בניסיון השני)';cls='goal';goalFlash();
  }else{
    G.saves++;G.results[G.i]='save';G.missed.push(st.id);
    head='השוער עצר הפעם';cls='save';
    if(q.kind==='choice'){const b=app.querySelector(`.opt[data-i="${q.answer}"]`);if(b)b.classList.add('right');}
    if(q.kind==='cmp'){const b=app.querySelector(`.opt[data-s="${q.answer}"]`);if(b)b.classList.add('right');}
  }
  app.querySelectorAll('.opt,#kick,#inp').forEach(el=>el.disabled=true);
  if(G.grid){G.grid.locked=true;G.grid.bad=-1;paintGrid(G.grid);const pad=app.querySelector(`.pad[data-g="${G.grid.id}"]`);if(pad)pad.hidden=true;}
  const last=G.i===G.qs.length-1;
  recordKick(item,ok,first);
  if(last)recordGameEnd();else saveCur();
  $('#tb').innerHTML=topbar();wireTop();
  const bumpEl=$(ok?'#sg':'#ss');if(bumpEl)bumpEl.classList.add('bump');
  $('#fb').innerHTML=`<div class="panel ${cls}"><h3>${head}</h3>${ok?'':`התשובה הנכונה: ${answerHTML(q)}`}<div class="explain"><b>ככה פותרים:</b><br>${q.explain}</div></div>
    <button class="kick wide next" id="next">${last?'לשריקת הסיום':'לבעיטה הבאה'}</button>`;
  $('#next').onclick=nextQ;
  $('#fb').scrollIntoView({behavior:reduced()?'auto':'smooth',block:'nearest'});
}
function nextQ(){G.i++;if(G.i>=G.qs.length)return G.mode==='cup'?endCup():G.mode==='redo'?endRedo():endStation();renderQ();}
function endStation(){
  screen='end';curGrid=null;
  const st=STATIONS.find(s=>s.id===G.sid),tr=G.tr||0,prev=G.prevBest||0;
  const msg=tr===3?'משחק מושלם!':tr===2?'ניצחון יפה! עוד קצת ותגיעו ל-3 גביעים.':tr===1?'עלינו על הלוח! משחק חוזר יביא עוד גביע.':'גם אלופים מפסידים לפעמים. קראו את הטיפים ונסו שוב.';
  app.innerHTML=`<section class="board final">
    <div class="brand">שריקת סיום – ${st.icon} ${st.name}</div>
    <div class="final-score"><span class="t">${esc(store.name||'אני')}</span><span class="d" dir="ltr">${G.saves}:${G.goals}</span><span class="t">השוער</span></div>
    <div class="trophies big" aria-label="${tr} גביעים">${trophies(tr)}</div>
    <p>${msg}</p>${tr>prev&&tr>0?'<p class="rec">שיא חדש במגרש הזה!</p>':''}
  </section>
  <div class="endbtns"><button class="kick wide" id="again">משחק חוזר</button><button class="ghost" id="home">חזרה לטבלת הליגה</button></div>`;
  const id=G.sid;$('#again').onclick=()=>startStation(id);$('#home').onclick=renderHome;window.scrollTo(0,0);
}
function endCup(){
  screen='end';curGrid=null;
  const score=G.goals,total=G.qs.length,isRec=!!G.isRec;
  const missed=uniq(G.missed).map(id=>STATIONS.find(s=>s.id===id));
  const msg=score===total?'אלופי הגביע! נראה שאתם מוכנים למבדק.':score>=10?'כמעט מושלם! עוד אימון קטן במגרשים שלמטה.':score>=7?'גמר יפה! כדאי להתאמן על המגרשים שלמטה.':'כל אלוף מתחיל באימונים. בואו נתאמן על המגרשים שלמטה ונחזור לגמר.';
  app.innerHTML=`<section class="board final">
    <div class="brand">🏆 גמר הגביע</div>
    <div class="final-score"><span class="d" dir="ltr">${score}/${total}</span></div>
    <p>${msg}</p>${isRec?'<p class="rec">שיא חדש!</p>':''}
  </section>
  ${missed.length?`<section class="practice"><h2>כדאי להתאמן על:</h2>${missed.map(st=>`<button class="row" data-id="${st.id}"><span class="ic" aria-hidden="true">${st.icon}</span><span class="nm">${st.name}</span></button>`).join('')}</section>`:''}
  <div class="endbtns"><button class="kick wide" id="again">עוד גמר</button><button class="ghost" id="home">חזרה לטבלת הליגה</button></div>`;
  app.querySelectorAll('.practice .row').forEach(b=>b.onclick=()=>startStation(b.dataset.id));
  $('#again').onclick=startCup;$('#home').onclick=renderHome;window.scrollTo(0,0);
}
function endRedo(){
  screen='end';curGrid=null;
  const left=weakKeys().length,all=G.goals===G.qs.length;
  app.innerHTML=`<section class="board final">
    <div class="brand">🔁 חזרה על טעויות</div>
    <div class="final-score"><span class="d" dir="ltr">${G.goals}/${G.qs.length}</span></div>
    <p>${all?'כל הכבוד! הפעם זה נכנס.':'יפה שחזרתם על זה. עוד חזרה אחת והתרגילים האלה ישבו טוב.'}</p>
    <p>${left?`עוד ${kindsText(left)} לחיזוק.`:'אין יותר טעויות שמחכות לחזרה. 💪'}</p>
  </section>
  <div class="endbtns">${left?'<button class="kick wide" id="again">עוד חזרה</button>':''}<button class="ghost" id="home">חזרה לטבלת הליגה</button></div>`;
  if(left)$('#again').onclick=startRedo;
  $('#home').onclick=renderHome;window.scrollTo(0,0);
}
function init(){
  app=document.getElementById('app');loadStore();
  window.addEventListener('keydown',onGridKeydown);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Sync.flushNow();else Sync.refresh();});
  window.addEventListener('pagehide',()=>Sync.flushNow());
  window.addEventListener('online',()=>{if(Sync.be)Sync.push(true);});
  if(!store.named)renderName();else renderHome();
  Sync.init();
  if(CLOUD){
    const hit=/[#&]p=([^&]+)/.exec(location.hash||''),pc=hit?normCode(decodeURIComponent(hit[1])):null;
    if(hit)try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    if(pc&&pc!==getPlayer())joinWithCode(pc).then(r=>{if(r.ok)renderHome();else if(r.err!=='cancel')renderCode(pc,r.err==='missing'?'לא מצאנו שחקן עם הקוד שבקישור. בדקו שהעתקתם את כולו.':'אין חיבור לשרת כרגע. נסו שוב בעוד רגע.');});
  }
}
if(typeof document!=='undefined'&&document.getElementById('app'))init();
</script>
